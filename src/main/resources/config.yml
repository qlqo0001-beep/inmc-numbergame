# ─────────────────────────────────────────────────────────────
#  inmc-numbergame  ·  공통 설정
#
#  게임 하나에만 해당하는 값은 여기 없습니다. 자릿수·시도 횟수·보상·랭킹 주기·
#  참가 조건은 전부 게임별 설정이며, 인게임에서
#      /숫자게임 관리 → 게임 목록 → (게임 선택)
#  으로 바꿉니다. 바꾼 값은 games/<id>.yml 에 자동 저장됩니다.
# ─────────────────────────────────────────────────────────────

session:
  # 입력이 이 시간 동안 없으면 진행 중이던 게임을 정리합니다.
  # 참가비를 낸 사람이 접속을 끊었다가 돌아올 여유는 주되, 방치된 세션이
  # 영원히 남지는 않게 하는 값입니다. 0 이면 정리하지 않습니다.
  idle-timeout: 10m

  # 같은 사람이 두 번 제출하기까지의 최소 간격(밀리초).
  # 사람 손으로는 걸릴 일이 없고, 매크로만 걸립니다.
  submit-cooldown-ms: 250

ranking:
  # 게임마다 보관할 지난 시즌 개수. 0 이면 보관하지 않습니다.
  season-archive-limit: 12

rewards:
  # announce 가 켜진 보상이 나왔을 때 서버 전체에 알립니다.
  broadcast: true

  # 인벤토리가 가득 찼을 때의 처리.
  #   false (기본) - 우편함으로 보냅니다. 나중에 /숫자게임 우편함 에서 받습니다.
  #   true         - 바닥에 떨어뜨립니다. 사라질 수 있으니 권장하지 않습니다.
  drop-when-full: false

mailbox:
  # 플레이어당 보관할 미수령 보상 개수. 넘치면 가장 오래된 것부터 밀려납니다.
  max-entries: 100

  # 이 기간이 지나도 안 찾아간 보상은 버립니다. 0 이면 영구 보관.
  # 서버를 떠난 유저의 시즌 보상이 계속 쌓이는 것을 막습니다.
  expire-after: 90d

storage:
  # 변경된 내용을 디스크에 쓰는 주기.
  #
  # 파일 쓰기 자체는 별도 스레드지만 YAML 을 만드는 작업은 메인 스레드에서 일어납니다.
  # 매초 하면 인원이 많은 서버에서 부담이 되므로 기본을 30초로 둡니다.
  # 서버 종료·리로드 시에는 이 값과 무관하게 즉시 저장하며,
  # 시즌 정산이나 보상 지급이 이 주기에 걸려 사라지는 일은 없습니다.
  save-interval: 30s

stats:
  # data/stats.yml 에 남길 최근 플레이 기록 수.
  log-size: 100

dialog:
  # 목록 다이얼로그 한 페이지에 넣을 항목 수.
  # 화면 높이를 넘기면 버튼이 밀려나므로 8 이상은 권장하지 않습니다.
  list-page-size: 8
