# 수열 규칙 찾기 - 기본 제공 게임
#
# 인게임에서 설정을 바꾸면 이 파일이 자동으로 다시 써집니다.
#   /숫자게임 관리 → 게임 목록 → 수열 규칙 찾기

type: SEQUENCE
display-name: 수열 규칙 찾기
enabled: true
order: 60
icon: minecraft:knowledge_book
description:
  - <gray>숫자들의 규칙을 찾아 다음에 올 수를 맞히세요.</gray>
  - <dark_gray>난이도를 올리면 피보나치·교대 규칙까지 나옵니다.</dark_gray>

settings:
  difficulty: NORMAL
  terms: 5
  rounds: 5
  mistakes-allowed: 2
  time-limit: 5m
  score-per-correct: 30

entry:
  daily-limit: 0
  daily-reset-hour: 4
  cooldown: 0s
  refund-on-fail: false
  fee:
    money: 0.0
    amount: 1

ranking:
  mode: CUMULATIVE_SCORE
  min-plays: 1
  board-size: 50
  announce-reset: true
  reset:
    policy: WEEKLY
    hour: 4
    minute: 0
    weekday: MONDAY
    day-of-month: 1
    interval: 7d
    timezone: ''

# 보상은 비워둔 채로 시작합니다.
#   관리 → 보상 설정   에서 아이템을 올려 등록하고,
#   관리 → 순위 보상   에서 시즌 종료 보상을 지정하세요.
rewards:
  triggers: {}
  record-tiers: {}
  rank-brackets: {}
