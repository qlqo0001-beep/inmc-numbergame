# 최저 유일 숫자 - 기본 제공 게임 (서버 전체 이벤트)
#
# 모두가 몰래 숫자를 하나 제출하고, 정산 시각에
# "아무도 고르지 않은 가장 작은 숫자" 를 고른 사람이 1위입니다.
# 같은 숫자를 두 명 이상이 고르면 그 숫자는 통째로 탈락합니다.
#
# 당첨 보상은 [순위 보상] 구간을 그대로 씁니다.
#   /숫자게임 관리 → 게임 목록 → 최저 유일 숫자 → 순위 보상

type: UNIQUE_BID
display-name: 최저 유일 숫자
enabled: true
order: 110
icon: minecraft:amethyst_shard
description:
  - <gray><white>1~100</white> 중 하나를 고르세요.</gray>
  - <dark_gray>아무도 안 고른 가장 작은 숫자가 이깁니다.</dark_gray>

settings:
  range-max: 100
  draw-interval: 1d
  entry-price: 500.0
  # 참가자가 이보다 적으면 그 회차는 무효가 되고 참가비를 돌려줍니다.
  min-players: 3
  score-for-win: 100

entry:
  daily-limit: 0
  daily-reset-hour: 4
  cooldown: 0s
  refund-on-fail: false
  fee:
    money: 0.0
    amount: 1

ranking:
  mode: CUMULATIVE_SCORE
  min-plays: 1
  board-size: 50
  announce-reset: true
  reset:
    policy: WEEKLY
    hour: 4
    minute: 0
    weekday: MONDAY
    day-of-month: 1
    interval: 7d
    timezone: ''

rewards:
  triggers: {}
  record-tiers: {}
  rank-brackets: {}
